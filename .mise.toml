# renovate: datasource=github-releases depName=jdx/mise
min_version = "2026.10.12"

[tools]
node = "24.21.0"
python = "3.15.0"
uv = "0.13.1"
dprint = "0.63.0"
yamlfmt = "0.21.0"
actionlint = "1.7.12"
shellcheck = "0.11.0"
gitleaks = "8.30.1"
lefthook = "2.2.2"
zizmor = "1.30.1"

[tasks.install]
run = ["npm ci", "npm run versions"]

[tasks.check]
run = "npm run check"

[tasks.lint]
run = ["dprint check", "git ls-files -z '*.yaml' '*.yml' | xargs -0 yamlfmt -lint", "actionlint", "zizmor --no-online-audits .github/workflows", "npm run check"]

[tasks.test]
run = "npm run test:coverage"

[tasks.build]
run = "npm run build"

[tasks.browser]
run = "npm run test:browser"

[tasks.verify]
depends = ["check", "test", "browser", "ha-versions", "ha-version-tests"]

[tasks.ha-versions]
run = "uv run --python \"$(mise which python)\" --no-project --with-requirements tests/ha-requirements.txt python scripts/check_ha_runtime.py"

[tasks.ha-version-tests]
run = "uv run --python \"$(mise which python)\" --no-project --with-requirements tests/ha-requirements.txt python -m unittest discover -s tests/tooling -p 'test_*.py'"

[tasks.ha-server]
run = "uv run --python \"$(mise which python)\" --no-project --with-requirements tests/ha-requirements.txt python scripts/ha-e2e-server.py"

[tasks.specify]
run = "uvx --from git+https://github.com/github/spec-kit.git@v1.1.3 specify"
