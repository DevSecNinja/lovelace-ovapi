# renovate: datasource=github-releases depName=jdx/mise
min_version = "2026.9.15"

[tools]
node = "22.23.3"
python = "3.14.8"
uv = "0.12.19"
dprint = "0.57.4"
yamlfmt = "0.21.0"
actionlint = "1.7.12"
shellcheck = "0.11.0"
gitleaks = "8.30.1"
lefthook = "2.1.12"
zizmor = "1.30.1"

[tasks.install]
run = "npm ci"

[tasks.check]
run = "npm run check"

[tasks.lint]
run = ["dprint check", "git ls-files -z '*.yaml' '*.yml' | xargs -0 yamlfmt -lint", "actionlint", "zizmor --no-online-audits .github/workflows", "npm run check"]

[tasks.test]
run = "npm run test:coverage"

[tasks.build]
run = "npm run build"

[tasks.browser]
run = "npm run test:browser"

[tasks.verify]
depends = ["check", "test", "browser"]

[tasks.specify]
run = "uvx --from git+https://github.com/github/spec-kit.git@v1.1.3 specify"
