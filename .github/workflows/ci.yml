---
name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    permissions:
      contents: read
      security-events: write
    uses: DevSecNinja/.github/.github/workflows/lint.yml@24acc67adf1be33089e73b2fdbdb4be8c12d145b # v3.2.0
    with:
      # renovate: datasource=github-releases depName=jdx/mise
      mise-version: "2026.10.7"
      lint-fail-on-error: true
      lint-go: false
      lint-yamllint: false
      lint-shellcheck: false
      lint-shfmt: false
      lint-checkov: false
      lint-trivy: false
      upload-sarif: false
  versions:
    name: Version and runtime contracts
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned tools
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: "2026.10.7"
      - run: mise run install
      - id: matrix
        run: echo "value=$(mise exec -- node scripts/check-versions.mjs --matrix)" >> "$GITHUB_OUTPUT"
      - run: mise exec -- npm run test:versions
      - run: mise run ha-versions
      - run: mise run ha-version-tests
  frontend:
    name: Frontend / offline verification
    needs: versions
    strategy:
      matrix: ${{ fromJSON(needs.versions.outputs.matrix) }}
    env:
      OVAPI_CI_NODE: ${{ matrix.node }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned tools
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: "2026.10.7"
      - name: Select declared minimum or development Node
        env:
          NODE_VERSION: ${{ matrix.node }}
        run: |
          mise install "node@$NODE_VERSION"
          echo "MISE_NODE_VERSION=$NODE_VERSION" >> "$GITHUB_ENV"
      - run: mise run install
      - run: mise run check
      - run: mise run test
      - run: mise exec -- npx playwright install --with-deps chromium
      - run: mise run browser
      - name: Confirm reproducible HACS bundle
        run: git diff --exit-code -- dist/lovelace-ovapi.js
