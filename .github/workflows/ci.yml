---
name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    permissions:
      contents: read
      security-events: write
    uses: DevSecNinja/.github/.github/workflows/lint.yml@24acc67adf1be33089e73b2fdbdb4be8c12d145b # v3.2.0
    with:
      mise-version: "2026.10.4"
      lint-fail-on-error: true
      lint-go: false
      lint-yamllint: false
      lint-shellcheck: false
      lint-shfmt: false
      lint-checkov: false
      lint-trivy: false
      upload-sarif: false
  frontend:
    name: Frontend / offline verification
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned tools
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: "2026.10.4"
      - run: mise run install
      - run: mise run check
      - run: mise run test
      - run: mise exec -- npx playwright install --with-deps chromium
      - run: mise run browser
      - name: Confirm reproducible HACS bundle
        run: git diff --exit-code -- dist/lovelace-ovapi.js
