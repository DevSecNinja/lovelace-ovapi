---
name: Release Please

# Opens or updates a `chore(main): release vX.Y.Z` PR on every push to main.
# Pattern A: release-please creates the tag and GitHub Release itself. The
# committed dist/lovelace-ovapi.js is what HACS serves from the tagged
# commit, so no tag-triggered asset publisher is needed.
#
# Requires the AUTOMATION_APP_ID variable and the AUTOMATION_APP_PRIVATE_KEY
# secret (DevSecNinja Automation App, `production` environment). The
# "Allow GitHub Actions to create and approve pull requests" setting is
# not needed.
#
# Onboarding guide:
#   https://github.com/DevSecNinja/.github/blob/main/docs/release-please-onboarding.md

on:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    uses: DevSecNinja/.github/.github/workflows/release-please.yml@5eceec313066eefaa0fe9e3dbf4f9a5a49b55ebd # v4.2.0
    permissions:
      contents: write
      pull-requests: write
    secrets:
      AUTOMATION_APP_PRIVATE_KEY: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
