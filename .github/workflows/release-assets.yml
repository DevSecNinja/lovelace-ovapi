---
name: Release assets

# HACS downloads the plugin file from release assets, and releases are immutable
# once published. release-please creates draft releases (draft: true); this
# builds the release commit, attaches dist/lovelace-ovapi.js and publishes.

on:
  release:
    types:
      - created
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to attach the asset to (e.g. v0.2.0)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-assets-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      DRAFT: ${{ github.event.release.draft }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.target_commitish || inputs.tag }}
          persist-credentials: false
      - name: Install pinned tools
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: "2026.10.19"
      - run: mise run install
      - run: mise run build
      - name: Upload asset
        run: gh release upload "$TAG" dist/lovelace-ovapi.js --clobber --repo "$GITHUB_REPOSITORY"
      - name: Publish draft release
        if: env.DRAFT == 'true'
        run: gh release edit "$TAG" --draft=false --repo "$GITHUB_REPOSITORY"
